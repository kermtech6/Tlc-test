<script>
(function () {
  var m = document.cookie.match(/(?:^|;\s*)theme=(light|dark)/);
  document.documentElement.setAttribute('data-theme', m ? m[1] : (localStorage.getItem('tlc_theme') || 'light'));
  var l = document.cookie.match(/(?:^|;\s*)lang=(fr|en)/);
  document.documentElement.lang = l ? l[1] : ((navigator.language || 'fr').toLowerCase().indexOf('en') === 0 ? 'en' : 'fr');
})();
</script>

<style>
:root{
  --navy-950:#071627;--navy-900:#0A1F3D;--navy-800:#0F2A4D;--navy-700:#17406B;
  --green-500:#1FAE6E;--green-400:#3FC98A;--green-050:#EAFBF2;
  --amber-500:#E8871E;
  --paper:#F6F4EC;--surface:#FFFFFF;--field:#FFFFFF;
  --ink-900:#10151F;--ink-600:#586173;--hair:#E7E2D3;
  --line:rgba(255,255,255,.14);
  --danger:#DC2626;
  --radius:16px;--app:480px;
  --f-display:'Space Grotesk',sans-serif;--f-body:'Inter',sans-serif;--f-mono:'IBM Plex Mono',monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --paper:#0B1220;--surface:#151E2E;--field:#0F1828;
  --ink-900:#F1F5F9;--ink-600:#94A3B8;--hair:#2A3648;
  --green-050:rgba(31,174,110,.14);
  --danger:#F87171;
}

*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--f-body);color:var(--ink-900);
  background:var(--paper);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100dvh;overflow-x:hidden;
  transition:background .3s var(--ease),color .3s var(--ease);
}
a{color:inherit;text-decoration:none}
h1,h2{font-family:var(--f-display);margin:0;line-height:1.12;letter-spacing:-.01em}
p{margin:0;line-height:1.6}
button{font-family:inherit}
img{display:block;max-width:100%}
.wrap{width:100%;max-width:var(--app);margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--green-400);outline-offset:2px;border-radius:8px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- EN-TETE ---------- */
header{background:var(--navy-900);border-bottom:1px solid var(--line);flex:none}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:10px;flex:none;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.brand-word{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.03em;line-height:1.25}
.brand-word span{display:block;font-family:var(--f-body);font-weight:400;font-size:9.5px;color:var(--green-400);letter-spacing:.08em;margin-top:2px}
.header-actions{display:flex;align-items:center;gap:7px;flex:none}
.icon-btn{
  background:transparent;border:1px solid var(--line);border-radius:9px;color:#fff;
  width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .25s,background .25s;
}
.icon-btn:hover{border-color:var(--green-400);background:rgba(63,201,138,.08)}
.icon-btn svg{width:17px;height:17px}
.lang-select{
  background:transparent;border:1px solid var(--line);border-radius:9px;color:#fff;
  padding:0 6px;height:36px;font-size:11.5px;font-weight:600;cursor:pointer;
  font-family:var(--f-mono);letter-spacing:.04em;transition:border-color .25s;
}
.lang-select option{background:var(--navy-900);color:#fff}

/* ---------- CORPS ---------- */
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0 34px}

.intro{margin-bottom:22px}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-500);
  margin-bottom:12px;
}
.eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--green-500);display:block}
.intro h1{font-size:26px;margin-bottom:8px}
.intro p{color:var(--ink-600);font-size:14px}

.card{
  background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);
  padding:22px 20px;
}

/* ---------- CHAMPS ---------- */
.field{margin-bottom:16px}
.field label{
  display:block;font-size:12.5px;font-weight:600;color:var(--ink-600);
  margin-bottom:7px;letter-spacing:.01em;
}
.control{position:relative}
/* 16px minimum : en dessous, iOS zoome sur le champ au focus */
.input{
  width:100%;height:52px;padding:0 15px;font-size:16px;font-family:inherit;
  color:var(--ink-900);background:var(--field);
  border:1px solid var(--hair);border-radius:12px;
  transition:border-color .2s,box-shadow .2s;
}
.input::placeholder{color:var(--ink-600);opacity:.65}
.input:focus{outline:none;border-color:var(--green-500);box-shadow:0 0 0 3px var(--green-050)}
.input.invalid{border-color:var(--danger)}
.has-toggle .input{padding-right:52px}

.toggle-pw{
  position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;border-radius:9px;
  background:transparent;color:var(--ink-600);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.toggle-pw:hover{color:var(--green-500)}
.toggle-pw svg{width:19px;height:19px}

.field-error{
  display:none;color:var(--danger);font-size:12px;margin-top:6px;
}
.field-error.show{display:block}

.row-between{display:flex;justify-content:flex-end;margin:-6px 0 18px}
.link{font-size:12.5px;font-weight:600;color:var(--green-500)}
.link:hover{text-decoration:underline}

/* ---------- BOUTONS ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;
  height:52px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;
  border:1px solid transparent;cursor:pointer;
  transition:transform .2s var(--ease),background .2s,border-color .2s,opacity .2s;
}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;pointer-events:none}
.btn-primary{background:var(--green-500);color:var(--navy-950)}
.btn-primary:hover{background:var(--green-400)}
.btn-outline{background:transparent;color:var(--ink-900);border-color:var(--hair)}
.btn-outline:hover{border-color:var(--green-500);color:var(--green-500)}

.spinner{
  width:17px;height:17px;border:2px solid rgba(7,22,39,.25);
  border-top-color:var(--navy-950);border-radius:50%;
  animation:spin .7s linear infinite;display:none;
}
.btn.loading .spinner{display:block}
.btn.loading .btn-label{opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- SEPARATEUR ---------- */
.sep{display:flex;align-items:center;gap:12px;margin:20px 0}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--hair)}
.sep span{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-600);
}

/* ---------- GOOGLE ---------- */
#googleHost{display:flex;justify-content:center;min-height:44px}
#googleFallback{display:none}
.btn-google{
  background:var(--field);color:var(--ink-900);border-color:var(--hair);
}
.btn-google:hover{border-color:var(--ink-600)}
.btn-google svg{width:19px;height:19px}

/* ---------- BAS DE PAGE ---------- */
.switch{
  text-align:center;margin-top:22px;font-size:13.5px;color:var(--ink-600);
}
.switch a{font-weight:600;color:var(--green-500)}
.switch a:hover{text-decoration:underline}

.legal{
  text-align:center;font-size:11.5px;color:var(--ink-600);
  margin-top:26px;line-height:1.7;
}
.legal a{color:var(--ink-600);text-decoration:underline}

/* ---------- ALERTE ---------- */
.alert{
  display:none;gap:10px;align-items:flex-start;
  padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.55;
  margin-bottom:18px;border:1px solid;
}
.alert.show{display:flex}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}
.alert-error{background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.3);color:var(--danger)}
.alert-info{background:var(--green-050);border-color:rgba(31,174,110,.35);color:var(--green-500)}

/* ---------- NOTIFICATION ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(120px);
  background:var(--surface);color:var(--ink-900);
  border:1px solid var(--hair);border-left-width:4px;
  padding:13px 20px;border-radius:12px;
  box-shadow:0 12px 34px -10px rgba(0,0,0,.32);
  z-index:9999;opacity:0;visibility:hidden;
  transition:opacity .3s,transform .35s var(--ease),visibility .3s;
  max-width:calc(100% - 36px);text-align:center;font-size:13.5px;font-weight:500;
}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%)}
.toast.success{border-left-color:var(--green-500)}
.toast.error{border-left-color:var(--danger)}

/* ---------- ENTREE ---------- */
.enter{opacity:0;transform:translateY(18px);animation:enter .6s var(--ease) forwards}
.enter-1{animation-delay:.05s}
.enter-2{animation-delay:.14s}
.enter-3{animation-delay:.23s}
@keyframes enter{to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<header>
  <div class="wrap nav">
    <a class="brand" href="/">
      <img class="brand-mark" src="https://i.ibb.co/v4M4QCH2/Lord-Kerm.jpg" alt="TLC International Cargo" width="34" height="34">
      <span class="brand-word">TLC INTERNATIONAL CARGO
        <span data-i18n="brand.tagline">Votre cargo, notre priorite</span>
      </span>
    </a>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Changer de theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></svg>
      </button>
      <select class="lang-select" id="langSelect" aria-label="Changer de langue">
        <option value="fr">FR</option>
        <option value="en">EN</option>
      </select>
    </div>
  </div>
</header>

<main>
  <div class="wrap">

    <div class="intro enter enter-1">
      <span class="eyebrow"><i></i><span data-i18n="login.eyebrow">Espace client</span></span>
      <h1 data-i18n="login.title">Bon retour parmi nous</h1>
      <p data-i18n="login.subtitle">Connectez-vous pour suivre vos colis, du depart de Yiwu jusqu'a votre porte.</p>
    </div>

    <div class="card enter enter-2">

      <div class="alert alert-error" id="alertError">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>
        </svg>
        <span id="alertErrorText"></span>
      </div>

      <div class="alert alert-info" id="alertInfo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
        </svg>
        <span id="alertInfoText"></span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email" data-i18n="login.email">Adresse email</label>
          <div class="control">
            <input class="input" type="email" id="email" name="email"
                   autocomplete="email" inputmode="email" required
                   placeholder="vous@exemple.com" data-i18n-ph="login.email_ph">
          </div>
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="field has-toggle">
          <label for="password" data-i18n="login.password">Mot de passe</label>
          <div class="control">
            <input class="input" type="password" id="password" name="password"
                   autocomplete="current-password" required
                   placeholder="••••••••" >
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Afficher le mot de passe">
              <svg id="pwIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"></svg>
            </button>
          </div>
          <div class="field-error" id="passwordError"></div>
        </div>

        <div class="row-between">
          <a class="link" href="/forgot-password" data-i18n="login.forgot">Mot de passe oublie ?</a>
        </div>

        <button class="btn btn-primary" type="submit" id="submitBtn">
          <span class="spinner"></span>
          <span class="btn-label" data-i18n="login.submit">Se connecter</span>
        </button>
      </form>

      <div class="sep"><span data-i18n="login.or">ou</span></div>

      <!-- Bouton officiel Google, rendu par le script Google Identity -->
      <div id="googleHost"></div>

      <!-- Affiche seulement si le script Google ne charge pas -->
      <button class="btn btn-outline btn-google" id="googleFallback" type="button">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.23c1.89-1.74 2.98-4.3 2.98-7.35Z"/>
          <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.61-2.42l-3.23-2.5c-.9.6-2.04.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.59A10 10 0 0 0 12 22Z"/>
          <path fill="#FBBC05" d="M6.41 13.92a6 6 0 0 1 0-3.83V7.5H3.07a10 10 0 0 0 0 9l3.34-2.58Z"/>
          <path fill="#EA4335" d="M12 5.98c1.47 0 2.79.5 3.83 1.5l2.86-2.86C16.95 2.99 14.7 2 12 2a10 10 0 0 0-8.93 5.5l3.34 2.59C7.2 7.73 9.4 5.98 12 5.98Z"/>
        </svg>
        <span class="btn-label" data-i18n="login.google">Continuer avec Google</span>
      </button>

    </div>

    <p class="switch enter enter-3">
      <span data-i18n="login.no_account">Pas encore de compte ?</span>
      <a href="/signup" data-i18n="login.signup">Creer un compte</a>
    </p>

    <p class="legal enter enter-3">
      <a href="/" data-i18n="login.back">Retour a l'accueil</a>
    </p>

  </div>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>

let LANG = 'fr';
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const t = (k) => (I18N[LANG] && I18N[LANG][k]) || k;

function cookie(name, value, days) {
  if (value === undefined) {
    const m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }
  document.cookie = name + '=' + encodeURIComponent(value) + ';path=/;max-age=' + ((days || 365) * 86400) + ';samesite=lax';
}

/* ---------- NOTIFICATION ---------- */
let toastTimer;
function toast(message, type) {
  const el = $('#toast');
  el.textContent = message;
  el.className = 'toast show ' + (type || 'success');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ---------- ALERTES ---------- */
function showError(message) {
  $('#alertErrorText').textContent = message;
  $('#alertError').classList.add('show');
  $('#alertInfo').classList.remove('show');
}
function showInfo(message) {
  $('#alertInfoText').textContent = message;
  $('#alertInfo').classList.add('show');
  $('#alertError').classList.remove('show');
}
function clearAlerts() {
  $('#alertError').classList.remove('show');
  $('#alertInfo').classList.remove('show');
}

/* ---------- THEME ---------- */
const SUN  = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>';
const MOON = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>';

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  $('#themeIcon').innerHTML = theme === 'dark' ? SUN : MOON;
  $('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0B1220' : '#0A1F3D');
  cookie('theme', theme);
  localStorage.setItem('tlc_theme', theme);
  renderGoogleButton();
}

/* ---------- OEIL DU MOT DE PASSE ---------- */
const EYE = '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
const EYE_OFF = '<path d="M10.6 6.7A9.9 9.9 0 0 1 12 6.5c6.4 0 10 6.5 10 6.5a18 18 0 0 1-3 3.7M6.2 8.3A17.7 17.7 0 0 0 2 12s3.6 6.5 10 6.5c1.6 0 3-.3 4.2-.9"/><path d="M3 3l18 18"/>';

function setPasswordVisible(visible) {
  $('#password').type = visible ? 'text' : 'password';
  $('#pwIcon').innerHTML = visible ? EYE_OFF : EYE;
  $('#togglePw').setAttribute('aria-label', visible ? t('login.hide_pw') : t('login.show_pw'));
}

/* ---------- LANGUE ---------- */
function applyLang(lang) {
  LANG = (lang === 'en') ? 'en' : 'fr';
  document.documentElement.lang = LANG;
  cookie('lang', LANG);

  $$('[data-i18n]').forEach(el => {
    const v = I18N[LANG][el.getAttribute('data-i18n')];
    if (v !== undefined) el.textContent = v;
  });
  $$('[data-i18n-ph]').forEach(el => {
    const v = I18N[LANG][el.getAttribute('data-i18n-ph')];
    if (v !== undefined) el.placeholder = v;
  });

  document.title = t('meta.title');
  $('#langSelect').value = LANG;
  setPasswordVisible($('#password').type === 'text');
  renderGoogleButton();
}

/* ---------- VALIDATION ---------- */
function fieldError(id, message) {
  const input = $('#' + id);
  const zone = $('#' + id + 'Error');
  if (message) {
    input.classList.add('invalid');
    zone.textContent = message;
    zone.classList.add('show');
  } else {
    input.classList.remove('invalid');
    zone.classList.remove('show');
  }
}

function validate() {
  let ok = true;
  const email = $('#email').value.trim();
  const password = $('#password').value;

  if (!email) { fieldError('email', t('err.email_required')); ok = false; }
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { fieldError('email', t('err.email_invalid')); ok = false; }
  else fieldError('email', null);

  if (!password) { fieldError('password', t('err.password_required')); ok = false; }
  else fieldError('password', null);

  return ok;
}

/* ---------- REDIRECTION APRES CONNEXION ---------- */
function destination(user) {
  const params = new URLSearchParams(location.search);
  const retour = params.get('returnTo');
  // On n'accepte qu'un chemin interne : un returnTo pointant vers un autre
  // domaine permettrait de rediriger un utilisateur connecte ailleurs.
  if (retour && /^\/(?!\/)/.test(retour)) return retour;
  return (user && user.role === 'admin') ? '/admin' : '/suivi';
}

/* ---------- CONNEXION PAR MOT DE PASSE ---------- */
async function submitLogin(event) {
  event.preventDefault();
  clearAlerts();
  if (!validate()) return;

  const bouton = $('#submitBtn');
  bouton.classList.add('loading');
  bouton.disabled = true;

  try {
    const res = await fetch('/api/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'same-origin',
      body: JSON.stringify({ email: $('#email').value.trim(), password: $('#password').value })
    });
    const data = await res.json();

    if (res.ok) {
      toast(t('ok.welcome'));
      location.href = destination(data.user);
      return;
    }

    // Compte non verifie : le serveur a renvoye un nouveau code
    if (data.unverified) {
      location.href = '/verify?email=' + encodeURIComponent(data.email || $('#email').value.trim());
      return;
    }

    showError(data.banned ? t('info.banned') : (data.error || t('err.network')));
  } catch (e) {
    showError(t('err.network'));
  } finally {
    bouton.classList.remove('loading');
    bouton.disabled = false;
  }
}

/* ---------- CONNEXION GOOGLE ---------- */
async function onGoogleCredential(response) {
  clearAlerts();
  try {
    const res = await fetch('/api/auth/google-login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'same-origin',
      body: JSON.stringify({ credential: response.credential })
    });
    const data = await res.json();

    if (res.ok) {
      toast(t('ok.welcome'));
      location.href = destination(data.user);
      return;
    }
    showError(data.banned ? t('info.banned') : (data.error || t('err.google')));
  } catch (e) {
    showError(t('err.google'));
  }
}

let googlePret = false;

function renderGoogleButton() {
  if (!googlePret) return;
  const hote = $('#googleHost');
  hote.innerHTML = '';
  const sombre = document.documentElement.getAttribute('data-theme') === 'dark';
  google.accounts.id.renderButton(hote, {
    type:'standard',
    theme: sombre ? 'filled_black' : 'outline',
    size:'large',
    shape:'pill',
    text:'continue_with',
    logo_alignment:'center',
    locale: LANG,
    width: Math.min(hote.clientWidth || 360, 400)
  });
}

function initGoogle() {
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) return false;
  if (GOOGLE_CLIENT_ID.indexOf('TON_CLIENT_ID') === 0) {
    // Identifiant pas encore renseigne : on montre le bouton de secours,
    // qui explique la situation plutot que d'echouer en silence.
    $('#googleFallback').style.display = 'inline-flex';
    $('#googleFallback').addEventListener('click', () => showError(t('err.google_config')));
    return true;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: onGoogleCredential,
    ux_mode:'popup',
    auto_select:false,
    cancel_on_tap_outside:true
  });
  googlePret = true;
  renderGoogleButton();
  return true;
}

/* ---------- MESSAGES VENANT DE L'URL ---------- */
function messagesUrl() {
  const p = new URLSearchParams(location.search);
  if (p.get('banned')) showError(t('info.banned'));
  else if (p.get('expired')) showInfo(t('info.session'));
  else if (p.get('reset')) showInfo(t('info.reset_ok'));
  else if (p.get('verified')) showInfo(t('info.signup_ok'));

  const email = p.get('email');
  if (email) $('#email').value = email;
}

/* ---------- DEMARRAGE ---------- */
(function () {
  applyTheme(cookie('theme') || localStorage.getItem('tlc_theme') || 'light');
  $('#themeToggle').addEventListener('click', () => {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  const langNav = (navigator.language || 'fr').toLowerCase().indexOf('en') === 0 ? 'en' : 'fr';
  applyLang(cookie('lang') || langNav);
  $('#langSelect').addEventListener('change', e => applyLang(e.target.value));

  setPasswordVisible(false);
  $('#togglePw').addEventListener('click', () => setPasswordVisible($('#password').type === 'password'));

  $('#loginForm').addEventListener('submit', submitLogin);
  $('#email').addEventListener('input', () => fieldError('email', null));
  $('#password').addEventListener('input', () => fieldError('password', null));

  messagesUrl();

  // Le script Google arrive en differe : on attend qu'il soit pret
  let essais = 0;
  const attente = setInterval(() => {
    if (initGoogle() || ++essais > 40) clearInterval(attente);
  }, 150);

  window.addEventListener('resize', renderGoogleButton);
})();
</script>
